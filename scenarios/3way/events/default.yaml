# 3-way Intersection - Default Events Configuration
# Simple accident obstacle and sensor failure scenario
# Time format: seconds from simulation start

ACCIDENTS:
  - id: accident_01
    depart_time: 170
    edge_id: "E1"
    lane_index: 1
    position: 80.0
    type: "barrier"
    duration: 30              # Stop for 30 seconds

SENSOR_FAILURES:
  - id: sensor_fail_E0
    depart_time: 220
    detector_id: "E0--s"      # South detector of E0
    duration: 30              # Fail for 30 seconds

